<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ian & Lizzy</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-cursor-hover="wedding/images/hover.webp" data-cursor-clicked="wedding/images/clicked.webp">
    <div id="app">
      <header class="hud">
        <div class="title-header">
          <h1>Our Room</h1>
          <div>Click around to learn more about us</div>
          <div class="discovery-progress" aria-live="polite">
            <div class="discovery-progress-copy">
              <span id="discovery-label">Items discovered</span>
              <span id="discovery-count">0/0</span>
            </div>
            <div class="discovery-progress-track" aria-hidden="true">
              <div id="discovery-bar" class="discovery-progress-fill"></div>
            </div>
            <button id="discovery-reset" class="discovery-reset" type="button" hidden>
              Reset
            </button>
          </div>
        </div>
        <div class="hud-actions">
          <button id="reset-view" class="pill pill-reset">Reset view</button>
          <a class="pill pill-secondary" href="/wedding">
            Wedding
          </a>
        </div>
      </header>

      <div id="canvas-wrap"></div>

      <div id="item-modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
          <button id="close-modal" class="close">Close</button>
          <div class="modal-title">Item</div>
          <div class="modal-preview" aria-hidden="true"></div>
          <div class="modal-body">Description</div>
        </div>
      </div>

    <script src="js/cursor.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
