<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ian & Lizzy</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="brand">
          <div class="badge">Ian & Lizzy</div>
          <h1>Our Room!</h1>
          <p>Click around to learn more about us</p>
        </div>
        <div class="hud-actions">
          <button id="reset-view" class="pill">Reset view</button>
          <a class="pill pill-secondary" href="/wedding">Wedding</a>
        </div>
      </header>

      <div id="canvas-wrap"></div>

      <div id="item-modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
          <button id="close-modal" class="close">Close</button>
          <div class="modal-title">Item</div>
          <div class="modal-preview" aria-hidden="true"></div>
          <div class="modal-body">Description</div>
        </div>
      </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
