<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ian & Lizzy</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <link rel="stylesheet" href="../styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <!-- Splitting.js for character animation -->
  <script src="https://unpkg.com/splitting@1.0.6/dist/splitting.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/splitting@1.0.6/dist/splitting.css" />
  <!-- Lenis smooth scroll — a single instance drives every scroll-reactive
       effect (see getLenis/onLenisScroll in hooks.js) instead of each component
       adding its own window 'scroll' listener. -->
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.13/dist/lenis.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Fragment+Mono&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300;1,9..144,400&family=Luxurious+Script&family=Pinyon+Script&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment:    '#f8f5f0',
            'parchment-2':'#f0ebe3',
            border:       '#e0d8ce',
            ink:          '#1a1714',
            'ink-2':      '#7a7068',
            'ink-3':      '#b0a898',
            blush:        '#e8cfc9',
          },
          fontFamily: {
            display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans:    ['"Space Grotesk"', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="wedding-page" data-cursor-hover="images/hover.webp" data-cursor-clicked="images/clicked.webp">
  <div id="app">
    <!-- React Wedding Site Mounts Here -->
    <div id="wedding-root"></div>
  </div>

  <script src="../js/cursor.js"></script>

  <!-- React wedding site — hooks and components in separate files -->
  <script type="text/babel" src="js/hooks.js"></script>
  <script type="text/babel" src="js/content.js"></script>
  <script type="text/babel" src="js/components/nav.js"></script>
  <script type="text/babel" src="js/components/hero.js"></script>
  <script type="text/babel" src="js/components/invitation.js"></script>
  <script type="text/babel" src="js/components/schedule.js"></script>
  <script type="text/babel" src="js/components/story.js"></script>
  <script type="text/babel" src="js/components/registry.js"></script>
  <script type="text/babel" src="js/components/faq.js"></script>
  <script type="text/babel" src="js/components/rsvp.js"></script>
  <script type="text/babel" src="js/components/footer.js"></script>
  <script type="text/babel" src="js/app.js"></script>

  <style>
    /* Story grid mobile collapse */
    @media (max-width: 767px) {
      .story-grid {
        grid-template-columns: 1fr !important;
      }
      .story-grid > div {
        grid-column: 1 !important;
        border-top: none !important;
      }
      .story-grid > div:first-child {
        border-top: none !important;
      }
    }
    /* Venue grid mobile */
    @media (max-width: 767px) {
      #venue > div {
        grid-template-columns: 1fr !important;
      }
      #venue > div > div:first-child {
        border-right: none !important;
        border-bottom: 1px solid #e0d8ce;
      }
    }
    /* Footer mobile */
    @media (max-width: 767px) {
      footer {
        grid-template-columns: 1fr !important;
        text-align: center !important;
      }
      footer > div:last-child {
        text-align: center !important;
      }
      .footer-calla-lily {
        display: block !important;
        margin-left: auto !important;
        margin-right: auto !important;
        justify-self: center !important;
      }
    }
    /* Scroll progress above nav */
    .scroll-progress { z-index: 102; }

  </style>
</body>
</html>
